  <title>Panorama — notícias classificadas</title>
  <style>
    :root { --ink:#16161d; --muted:#777780; --soft:#f1f1f4; --line:#e6e6e9; --surface:#fff; --page:#ececef; --sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--page); }
    body { margin: 0; color: var(--ink); background: var(--surface); font-family: var(--sans); }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    .app { width: 100%; min-height: 100vh; margin: 0 auto; background: var(--surface); }
    .topbar { padding: max(24px, env(safe-area-inset-top)) 20px 19px; border-bottom: 1px solid var(--line); }
    .topline { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .brand { margin: 0; font-size: clamp(1.85rem, 8vw, 2.4rem); line-height: 1; letter-spacing: -.055em; font-weight: 820; }
    .counter { margin: 9px 0 0; color: #909097; font-size: 1rem; }
    .mark-visible { width:42px; height:42px; flex:0 0 42px; border:1px solid var(--line); border-radius:50%; background:#fff; color:var(--ink); font-size:1.25rem; cursor:pointer; }
    .mark-visible:active { transform: scale(.96); }
    .filters { padding:14px 16px; background:#fafafd; border-bottom:1px solid var(--line); }
    .filter-grid { display:grid; grid-template-columns:1fr 108px; gap:9px; }
    .control { width:100%; min-height:43px; border:1px solid #d9d9df; border-radius:11px; background:#fff; color:var(--ink); padding:0 12px; outline:none; }
    .control:focus { border-color:#73737f; box-shadow:0 0 0 3px rgba(68,68,79,.10); }
    .filter-search { grid-column:1/-1; }
    .filter-search::placeholder { color:#9a9aa3; }
    .toggle { display:flex; align-items:center; justify-content:center; gap:7px; cursor:pointer; font-size:.84rem; font-weight:720; }
    .toggle[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
    .toggle-dot { width:7px; height:7px; border-radius:50%; background:#a2a2aa; }
    .toggle[aria-pressed="true"] .toggle-dot { background:#72e29d; }
    .section { scroll-margin-top:10px; }
    .section-header { display:flex; align-items:center; justify-content:space-between; gap:14px; min-height:62px; padding:13px 20px; background:var(--soft); border-left:5px solid var(--accent); border-bottom:1px solid #dddde1; }
    .section-header h2 { margin:0; font-size:1.08rem; line-height:1.2; font-weight:800; letter-spacing:-.015em; }
    .section-header p { margin:3px 0 0; color:var(--muted); font-size:.73rem; }
    .section-score { min-width:36px; height:29px; padding:0 9px; border-radius:999px; display:grid; place-items:center; color:#fff; background:var(--accent); font-size:.82rem; font-weight:820; }
    .story { position:relative; padding:20px; border-bottom:1px solid var(--line); background:#fff; transition:opacity .18s,background .18s; }
    .story.is-read { opacity:.43; background:#fbfbfc; }
    .story-link { display:grid; grid-template-columns:112px minmax(0,1fr); gap:16px; text-decoration:none; }

    .cover::after { content:""; position:absolute; width:13%; aspect-ratio:1; border-radius:50%; background:#ededf1; top:31%; right:30%; }
    .cover img { position:relative; z-index:1; width:100%; height:100%; object-fit:cover; display:block; }
    .story-copy { min-width:0; }
    .eyebrow { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
    .score { padding:3px 7px; border-radius:999px; background:var(--accent); color:#fff; font-size:.66rem; font-weight:820; }
    .category { min-width:0; color:var(--accent); font-size:.68rem; font-weight:790; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .headline { margin:0; font-size:1rem; line-height:1.23; letter-spacing:-.017em; font-weight:820; }
    .summary { margin:7px 0 0; color:#5d5d65; font-size:.82rem; line-height:1.35; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .why { margin:7px 0 0; color:#33333a; font-size:.78rem; line-height:1.35; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .why b { color:var(--accent); }
    .meta { margin:8px 0 0; color:#9999a1; font-size:.75rem; line-height:1.25; }
    .story-actions { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:12px 0 0 128px; }
    .read-toggle { min-height:34px; padding:0 11px; border:1px solid #d9d9df; border-radius:999px; background:#fff; color:#55555e; font-size:.72rem; font-weight:740; cursor:pointer; }
    .story.is-read .read-toggle { border-color:#909098; color:var(--ink); }
    details { font-size:.72rem; color:#696972; }
    details summary { cursor:pointer; font-weight:720; list-style:none; }
    details summary::-webkit-details-marker { display:none; }
    details summary::after { content:" +"; }
    details[open] summary::after { content:" −"; }
    .details-body { margin-top:10px; padding:12px; border-radius:10px; background:#f6f6f8; line-height:1.45; }
    .metric-row { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin-bottom:9px; }
    .metric { padding:7px 8px; border-radius:7px; background:#fff; }
    .metric b { display:block; color:var(--ink); font-size:.74rem; }
    .data-row { display:flex; flex-wrap:wrap; gap:5px; }
    .tag { padding:4px 7px; border-radius:6px; background:#fff; }
    .related { margin:10px 0 0; padding-left:18px; }
    .related li + li { margin-top:5px; }
    .empty { padding:70px 28px; text-align:center; color:var(--muted); }
    .footer { padding:30px 20px max(34px,env(safe-area-inset-bottom)); color:#9999a1; font-size:.7rem; text-align:center; }
    @media (max-width:390px) {
      .topbar { padding-left:17px; padding-right:17px; }
      .story { padding:17px; }
      .story-link { grid-template-columns:96px minmax(0,1fr); gap:13px; }
      .cover { width:96px; }
      .story-actions { margin-left:109px; }
      .headline { font-size:.94rem; }
      .summary,.why { -webkit-line-clamp:2; }
    }
    @media (min-width:720px) {
      body { padding:24px 0; background:var(--page); }

      .topbar { padding-left:28px; padding-right:28px; }
      .filters { padding-left:22px; padding-right:22px; }
      .filter-grid { grid-template-columns:minmax(0,1fr) 180px 150px; }
      .filter-search { grid-column:auto; }
      .story { padding:24px 28px; }
      .story-link { grid-template-columns:138px minmax(0,1fr); gap:20px; }
      .cover { width:138px; }
      .headline { font-size:1.17rem; }
      .summary { font-size:.9rem; }
      .why { font-size:.84rem; }
      .story-actions { margin-left:158px; }
    }
    @media print {
      body { padding:0; background:#fff; }
      .app { width:100%; box-shadow:none; }
      .filters,.mark-visible,.read-toggle,details,.footer { display:none!important; }
      .story.is-read { opacity:1; }
    }

      $("#newsRoot").innerHTML=filtered.length?[...groups.entries()].map(([score,items])=>`<section class="section" style="--accent:${scoreColor(score)}"><header class="section-header"><div><h2>Score ${score} · ${escapeHTML(scoreLabels[score])}</h2><p>${items.length} ${items.length===1?"notícia":"notícias"} · mais recentes primeiro</p></div><span class="section-score">${score}</span></header>${items.map(renderCard).join("")}</section>`).join(""):`<div class="empty"><strong>Nenhuma notícia encontrada.</strong><br>Ajuste os filtros para ampliar a leitura.</div>`;
      $("#visibleCount").textContent=filtered.length; $("#unreadCount").textContent=NEWS.filter(item=>!readIds.has(item.id)).length;
      document.querySelectorAll("[data-read-id]").forEach(button=>button.addEventListener("click",()=>toggleRead(button.dataset.readId)));
      document.querySelectorAll("[data-open-id]").forEach(link=>link.addEventListener("click",()=>markRead(link.dataset.openId)));
    }
    const categories=[...new Set(NEWS.map(item=>item.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
    $("#categoryFilter").insertAdjacentHTML("beforeend",categories.map(category=>`<option value="${escapeHTML(category)}">${escapeHTML(category)}</option>`).join(""));
    $("#search").addEventListener("input",event=>{ state.query=event.target.value.trim().toLocaleLowerCase("pt-BR"); render(); });
    $("#categoryFilter").addEventListener("change",event=>{ state.category=event.target.value; render(); });
    $("#unreadOnly").addEventListener("click",event=>{ state.unreadOnly=!state.unreadOnly; event.currentTarget.setAttribute("aria-pressed",String(state.unreadOnly)); render(); });
    $("#markVisible").addEventListener("click",()=>{ NEWS.filter(matches).forEach(item=>readIds.add(item.id)); saveReadState(); render(); });
    $("#generatedAt").textContent=formatDate(GENERATED_AT); render();
  </script>
</body>
</html>
